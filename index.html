<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本語 – Japanisch Vokabeltrainer</title>
  <style>
    :root {
      --ink: #242338; --muted: #77758a; --paper: #fffdf9;
      --accent: #d94f70; --accent-dark: #b93657; --line: #eee7e5;
      --green: #25845d; --red: #c33e4e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 10% 8%, #fbe2e8 0, transparent 28%),
        radial-gradient(circle at 90% 90%, #e8e8fa 0, transparent 30%), #f8f6f3;
      display: grid; place-items: center; padding: 24px;
    }
    .app { width: min(100%, 600px); }
    header { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .logo { width:46px; height:46px; border-radius:15px; background:var(--accent); color:white; display:grid; place-items:center; font-size:25px; }
    h1 { margin:0; font-size:19px; letter-spacing:-.4px; }
    .subtitle { color:var(--muted); font-size:12px; margin-top:2px; }
    .tag { font-size:12px; font-weight:700; color:var(--accent-dark); background:#fce8ed; padding:7px 11px; border-radius:20px; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
    .stat { background:rgba(255,255,255,.8); border:1px solid var(--line); border-radius:15px; padding:12px; text-align:center; }
    .stat strong { display:block; font-size:21px; }
    .stat span { color:var(--muted); font-size:11px; }
    .card { background:var(--paper); border:1px solid var(--line); border-radius:24px; padding:clamp(22px,5vw,36px); box-shadow:0 18px 60px #42304b12; }
    .progress-head { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; margin-bottom:8px; }
    .progress { height:6px; background:#f0e9e8; border-radius:20px; overflow:hidden; margin-bottom:28px; }
    .bar { height:100%; width:0; background:var(--accent); border-radius:20px; transition:width .25s; }
    .prompt-label { text-align:center; color:var(--muted); font-size:13px; }
    .word { text-align:center; font-size:clamp(36px,9vw,54px); font-weight:750; letter-spacing:-1.5px; margin:10px 0 6px; }
    .hint { text-align:center; color:var(--muted); font-size:13px; margin-bottom:25px; }
    .input-wrapper { position: relative; }
    input { width:100%; border:1.5px solid #e8dfe0; border-radius:13px; padding:15px 16px; font-size:18px; outline:none; background:white; color:var(--ink); text-align:center; }
    input:focus { border-color:var(--accent); box-shadow:0 0 0 3px #d94f7015; }
    input:disabled { background:#faf7f6; }
    .romaji-preview { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); background: #f3eff1; padding: 4px 10px; border-radius: 8px; font-size: 11px; color: var(--muted); white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
    .romaji-preview.show { opacity: 1; }
    .feedback { margin-top:12px; padding:13px; border-radius:12px; text-align:center; font-size:14px; min-height: 20px; }
    .feedback.good { background:#eaf6ef; color:var(--green); }
    .feedback.bad { background:#fff0f0; color:var(--red); }
    .feedback.neutral { background:#f3eff1; color:var(--muted); }
    .feedback small { display:block; margin-top:4px; color:inherit; opacity:.85; }
    button { border:0; border-radius:13px; padding:14px 18px; font:inherit; font-weight:700; cursor:pointer; transition:transform .12s, background .12s; }
    button:active { transform:scale(.98); }
    .primary { width:100%; margin-top:14px; background:var(--accent); color:white; }
    .primary:hover { background:var(--accent-dark); }
    .secondary { background:#f3eff1; color:var(--ink); }
    .controls { display:flex; justify-content:space-between; gap:10px; margin-top:12px; }
    .controls button { flex:1; font-size:13px; }
    .foot { text-align:center; color:var(--muted); font-size:12px; margin-top:18px; }
    .finished { text-align:center; padding:14px 0; }
    .finished .emoji { font-size:48px; }
    .finished h2 { margin:10px 0; }
    @media (max-width:420px) { header { align-items:flex-start; } .tag { margin-top:5px; } .controls button { padding:12px 8px; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="logo">あ</div>
        <div>
          <h1>Japanisch Vokabeltrainer</h1>
          <div class="subtitle">Lerne Schritt für Schritt 日本語</div>
        </div>
      </div>
      <div class="tag">JLPT N5</div>
    </header>

    <section class="stats" aria-label="Lernstatistik">
      <div class="stat"><strong id="score">0</strong><span>Richtig</span></div>
      <div class="stat"><strong id="streak">0</strong><span>Serie 🔥</span></div>
      <div class="stat"><strong id="remaining">0</strong><span>Übrig</span></div>
    </section>

    <section class="card" id="quiz">
      <div class="progress-head"><span id="questionCount">Frage 1 von 100</span><span id="percent">0 %</span></div>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="prompt-label">Wie heißt dieses Wort auf Japanisch?</div>
      <div class="word" id="german">Hund</div>
      <div class="hint">Tippe in Romaji – es wird automatisch in Hiragana/Katakana umgewandelt.</div>
      <form id="answerForm">
        <div class="input-wrapper">
          <div class="romaji-preview" id="romajiPreview"></div>
          <input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Japanische Antwort …" aria-label="Japanische Antwort" />
        </div>
        <div class="feedback neutral" id="feedback" role="status">Bereit für die erste Vokabel!</div>
      </form>
    </section>

    <div class="controls">
      <button class="secondary" id="skip">Überspringen ↷</button>
      <button class="secondary" id="restart">Neu starten ⟳</button>
    </div>
    <div class="foot">小さな一歩 · Jeder kleine Schritt zählt</div>
  </main>

  // Komplettes N5-Vokabular (100 wichtigste Wörter)
  const vocabulary = [

    {de:"Milch", answers:["ぎゅうにゅう","牛乳","gyuunyuu"], reading:"ぎゅうにゅう"},
    {de:"Reis (gekocht)", answers:["ごはん","ご飯","gohan"], reading:"ごはん"},

    {de:"Fleisch", answers:["にく","肉","niku"], reading:"にく"},

    {de:"Obst", answers:["くだもの","果物","kudamono"], reading:"くだもの"},

    {de:"Mittag", answers:["ひる","昼","hiru"], reading:"ひる"},

    {de:"Heute", answers:["きょう","今日","kyou","kyo"], reading:"きょう"},
    {de:"Gestern", answers:["きのう","昨日","kinou"], reading:"きのう"},
    {de:"Morgen (nächster Tag)", answers:["あした","明日","ashita"], reading:"あした"},

    {de:"Woche", answers:["しゅう","週","shuu"], reading:"しゅう"},

    {de:"Berg", answers:["やま","山","yama"], reading:"やま"},
    {de:"Fluss", answers:["かわ","川","kawa"], reading:"かわ"},
    {de:"Meer", answers:["うみ","海","umi"], reading:"うみ"},
    {de:"Himmel", answers:["そら","空","sora"], reading:"そら"},
    {de:"Sonne / Tag", answers:["ひ","日","hi"], reading:"ひ"},
    {de:"Mond", answers:["つき","月","tsuki"], reading:"つき"},
    {de:"Stern", answers:["ほし","星","hoshi"], reading:"ほし"},
    {de:"Regen", answers:["あめ","雨","ame"], reading:"あめ"},
    {de:"Schnee", answers:["ゆき","雪","yuki"], reading:"ゆき"},
    {de:"Wind", answers:["かぜ","風","kaze"], reading:"かぜ"},
    {de:"Baum", answers:["き","木","ki"], reading:"き"},
    {de:"Blume", answers:["はな","花","hana"], reading:"はな"},
    {de:"Gras", answers:["くさ","草","kusa"], reading:"くさ"},
    {de:"Groß", answers:["おおきい","大きい","ookii"], reading:"おおきい"},
    {de:"Klein", answers:["ちいさい","小さい","chiisai"], reading:"ちいさい"},
    {de:"Neu", answers:["あたらしい","新しい","atarashii"], reading:"あたらしい"},
    {de:"Alt", answers:["ふるい","古い","furui"], reading:"ふるい"},
    {de:"Gut", answers:["いい","よい","良い","ii","yoi"], reading:"いい"},
    {de:"Schlecht", answers:["わるい","悪い","warui"], reading:"わるい"},
    {de:"Schön", answers:["きれい","綺麗","kirei"], reading:"きれい"},
    {de:"Heiß", answers:["あつい","暑い","熱い","atsui"], reading:"あつい"},
    {de:"Kalt", answers:["さむい","寒い","samui"], reading:"さむい"},
    {de:"Liebe", answers:["あい","愛","ai"], reading:"あい"},
    {de:"Ja", answers:["はい","hai"], reading:"はい"},
    {de:"Nein", answers:["いいえ","iie"], reading:"いいえ"},
    {de:"Danke", answers:["ありがとう","arigatou","arigato"], reading:"ありがとう"},
    {de:"Entschuldigung", answers:["すみません","sumimasen"], reading:"すみません"},
    {de:"Hallo (tagsüber)", answers:["こんにちは","konnichiwa"], reading:"こんにちは"},
    {de:"Guten Morgen", answers:["おはよう","ohayou","ohayo"], reading:"おはよう"},
    {de:"Guten Abend", answers:["こんばんは","konbanwa"], reading:"こんばんは"},
    {de:"Auf Wiedersehen", answers:["さようなら","さよなら","sayounara","sayonara"], reading:"さようなら"},
    {de:"Gute Nacht", answers:["おやすみ","oyasumi"], reading:"おやすみ"}
  ];

  // Romaji zu Hiragana/Katakana Konvertierung
  const romajiMap = {
    // Hiragana
    'a':'あ','i':'い','u':'う','e':'え','o':'お',
    'ka':'か','ki':'き','ku':'く','ke':'け','ko':'こ',
    'ga':'が','gi':'ぎ','gu':'ぐ','ge':'げ','go':'ご',
    'sa':'さ','shi':'し','su':'す','se':'せ','so':'そ',
    'za':'ざ','ji':'じ','zu':'ず','ze':'ぜ','zo':'ぞ',
    'ta':'た','chi':'ち','tsu':'つ','te':'て','to':'と',
    'da':'だ','di':'ぢ','du':'づ','de':'で','do':'ど',
    'na':'な','ni':'に','nu':'ぬ','ne':'ね','no':'の',
    'ha':'は','hi':'ひ','fu':'ふ','he':'へ','ho':'ほ',
    'ba':'ば','bi':'び','bu':'ぶ','be':'べ','bo':'ぼ',
    'pa':'ぱ','pi':'ぴ','pu':'ぷ','pe':'ぺ','po':'ぽ',
    'ma':'ま','mi':'み','mu':'む','me':'め','mo':'も',
    'ya':'や','yu':'ゆ','yo':'よ',
    'ra':'ら','ri':'り','ru':'る','re':'れ','ro':'ろ',
    'wa':'わ','wo':'を','n':'ん',
    // Kombinationen
    'kya':'きゃ','kyu':'きゅ','kyo':'きょ',
    'gya':'ぎゃ','gyu':'ぎゅ','gyo':'ぎょ',
    'sha':'しゃ','shu':'しゅ','sho':'しょ',
    'ja':'じゃ','ju':'じゅ','jo':'じょ',
    'cha':'ちゃ','chu':'ちゅ','cho':'ちょ',
    'nya':'にゃ','nyu':'にゅ','nyo':'にょ',
    'hya':'ひゃ','hyu':'ひゅ','hyo':'ひょ',
    'bya':'びゃ','byu':'びゅ','byo':'びょ',
    'pya':'ぴゃ','pyu':'ぴゅ','pyo':'ぴょ',
    'mya':'みゃ','myu':'みゅ','myo':'みょ',
    'rya':'りゃ','ryu':'りゅ','ryo':'りょ',
    // Lange Vokale
    'aa':'ああ','ii':'いい','uu':'うう','ee':'ええ','oo':'おう','ou':'おう',
    // Sonderfälle
    'nn':'ん','n ':'ん',
    // Katakana für Fremdwörter
    'fa':'ファ','fi':'フィ','fe':'フェ','fo':'フォ',
    'va':'ヴァ','vi':'ヴィ','vu':'ヴ','ve':'ヴェ','vo':'ヴォ',
    'ti':'ティ','tu':'トゥ','di':'ディ','du':'ドゥ'
  };

  function romajiToKana(romaji) {
    let result = '';
    let input = romaji.toLowerCase();
    let i = 0;
    
    while (i < input.length) {
      let matched = false;
      
      // Versuche längste Übereinstimmung zuerst (3, dann 2, dann 1 Zeichen)
      for (let len = 3; len >= 1; len--) {
        let substr = input.substr(i, len);
        
        if (romajiMap[substr]) {
          result += romajiMap[substr];
          i += len;
          matched = true;
          break;
        }
      }
      
      // Doppelkonsonanten (っ)
      if (!matched && i < input.length - 1) {
        let current = input[i];
        let next = input[i + 1];
        
        if (current === next && 'kgsztdhbpmyrw'.includes(current)) {
          result += 'っ';
          i++;
          matched = true;
        }
      }
      
      if (!matched) {
        result += input[i];
        i++;
      }
    }
    
    return result;
  }

  const $ = id => document.getElementById(id);
  let deck = [], wrongAnswers = [], index = 0, score = 0, streak = 0, isRetryRound = false;
  let currentAnswer = '';

  function shuffle(items) {
    const copy = [...items];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function normalize(text) {
    return text.trim().toLowerCase().replace(/\s+/g, "");
  }

  function start() {
    deck = shuffle([...vocabulary]);
    wrongAnswers = [];
    index = 0; score = 0; streak = 0; isRetryRound = false;
    currentAnswer = '';
    updateStats(); render();
  }

  function startRetryRound() {
    if (wrongAnswers.length === 0) {
      start();
      return;
    }
    deck = shuffle([...wrongAnswers]);
    wrongAnswers = [];
    index = 0;
    isRetryRound = true;
    currentAnswer = '';
    updateStats(); render();
  }

  function updateStats() {
    $("score").textContent = score;
    $("streak").textContent = streak;
    $("remaining").textContent = Math.max(0, deck.length - index);
    const pct = deck.length ? Math.round(index / deck.length * 100) : 0;
    $("bar").style.width = pct + "%";
    $("percent").textContent = pct + " %";
    $("questionCount").textContent = index < deck.length ? `Frage ${index + 1} von ${deck.length}` : "Geschafft!";
  }

  function render() {
    if (index >= deck.length) {
      const retryButton = wrongAnswers.length > 0 
        ? `<button class="primary" onclick="startRetryRound()">Falsche Vokabeln wiederholen (${wrongAnswers.length})</button>` 
        : '';
      
      $("quiz").innerHTML = `<div class="finished">
        <div class="emoji">🎉</div>
        <h2>${isRetryRound ? 'Wiederholung abgeschlossen!' : 'Gut gemacht!'}</h2>
        <p>Du hast ${score} von ${deck.length} Vokabeln richtig beantwortet.</p>
        <p>Deine Trefferquote: ${Math.round(score / deck.length * 100)} %</p>
        ${retryButton}
        <button class="primary" onclick="start()" style="margin-top:10px">Neue Runde starten</button>
      </div>`;
      updateStats(); 
      return;
    }
    
    const item = deck[index];
    $("german").textContent = item.de;
    $("answer").value = "";
    $("answer").disabled = false;
    $("answer").focus();
    
    const feedback = $("feedback");
    feedback.className = "feedback neutral";
    feedback.innerHTML = currentAnswer ? currentAnswer : "Tippe die Antwort ein...";
    
    currentAnswer = '';
    updateStats();
  }

  // Live Romaji zu Kana Konvertierung
  $("answer").addEventListener("input", (e) => {
    const input = e.target;
    const cursorPos = input.selectionStart;
    const beforeCursor = input.value.substring(0, cursorPos);
    const afterCursor = input.value.substring(cursorPos);
    
    // Zeige Romaji-Vorschau
    const preview = $("romajiPreview");
    if (input.value.length > 0) {
      preview.textContent = `Romaji: ${input.value}`;
      preview.classList.add("show");
    } else {
      preview.classList.remove("show");
    }
    
    // Konvertiere zu Kana
    const convertedBefore = romajiToKana(beforeCursor);
    const convertedAfter = romajiToKana(afterCursor);
    const newValue = convertedBefore + convertedAfter;
    
    if (newValue !== input.value) {
      input.value = newValue;
      input.setSelectionRange(convertedBefore.length, convertedBefore.length);
    }
  });

  // Auto-Submit bei korrekter Eingabe
  $("answer").addEventListener("input", (e) => {
    const typed = normalize(e.target.value);
    if (!typed || index >= deck.length) return;
    
    const item = deck[index];
    const correct = item.answers.some(answer => normalize(answer) === typed);
    
    if (correct) {
      // Kurze Verzögerung für visuelles Feedback
      setTimeout(() => {
        score++;
        streak++;
        
        const feedback = $("feedback");
        feedback.className = "feedback good";
        feedback.innerHTML = `✓ Richtig! ${item.answers[0]} · ${item.reading}`;
        
        currentAnswer = feedback.innerHTML;
        
        $("score").textContent = score;
        $("streak").textContent = streak;
        
        // Automatisch zur nächsten Frage
        setTimeout(() => {
          index++;
          render();
        }, 800);
      }, 100);
    }
  });

  $("answerForm").addEventListener("submit", event => {
    event.preventDefault();
  });

  $("skip").addEventListener("click", () => {
    if (index >= deck.length) return;
    
    const item = deck[index];
    wrongAnswers.push(item);
    
    const feedback = $("feedback");
    feedback.className = "feedback bad";
    feedback.innerHTML = `Übersprungen. Lösung: ${item.answers[0]}<small>Lesung: ${item.reading}</small>`;
    
    currentAnswer = feedback.innerHTML;
    streak = 0;
    
    setTimeout(() => {
      index++;
      render();
    }, 1200);
  });

  $("restart").addEventListener("click", start);

  // Bei falscher Eingabe nach Enter
  $("answer").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const typed = normalize(e.target.value);
      if (!typed || index >= deck.length) return;
      
      const item = deck[index];
      const correct = item.answers.some(answer => normalize(answer) === typed);
      
      if (!correct && typed.length > 0) {
        wrongAnswers.push(item);
        streak = 0;
        
        const feedback = $("feedback");
        feedback.className = "feedback bad";
        feedback.innerHTML = `✗ Falsch. Lösung: ${item.answers[0]}<small>Lesung: ${item.reading}</small>`;
        
        currentAnswer = feedback.innerHTML;
        
        setTimeout(() => {
          index++;
          render();
        }, 1200);
      }
    }
  });

  start();
</script>
</body>
</html>
